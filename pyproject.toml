[project]
name = "planlearn"
version = "0.1.0"
description = "Multi-agent planner that turns textbooks into 20-minute learning roadmaps"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "numpy"]

[project.optional-dependencies]
llm = ["anthropic"]
chroma = ["chromadb", "sentence-transformers"]
ingest = ["pymupdf", "tiktoken"]
mcp = ["mcp[cli]"]
dev = ["pytest"]

[project.scripts]
planlearn = "planlearn.cli:main"
planlearn-mcp = "planlearn.mcp_server:main"

[tool.setuptools.packages.find]
include = ["planlearn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
